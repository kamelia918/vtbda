<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Content</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 20px;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            align-items: center;
        }

        .block {
            text-align: center;
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 250px;
            cursor: pointer;
        }

        .block:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }

        .block img {
            width: 80px;
            margin-bottom: 1rem;
        }

        .block h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }

        .block p {
            font-size: 0.875rem;
            color: #64748b;
        }

        .block a {
            display: block;
            margin-top: 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: white;
            background: #4f46e5;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .block a:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Bloc ArXiv -->
        <div class="block">
            
            <h3>Veille sur arXiv</h3>
            <p>Explorez les articles académiques récents disponibles sur arXiv.</p>
            <a href="{% url 'fetch_arxiv_articles' task.id %}">Voir les articles</a>
        </div>
    
        <!-- Bloc PLOS ONE -->
        <div class="block">
            
            <h3>Veille sur PLOS ONE</h3>
            <p>Recherchez les publications de recherche dans PLOS ONE.</p>
            <a href="{% url 'plos_article' task.id %}">Voir les articles</a>
           
        </div>
        
    </div>
</body>
</html>
